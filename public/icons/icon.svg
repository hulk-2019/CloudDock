<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- 渐变背景 -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 圆角矩形背景 -->
  <rect width="128" height="128" rx="24" fill="url(#bg-gradient)"/>

  <!-- 云朵 -->
  <g transform="translate(64, 58)">
    <!-- 云朵主体 -->
    <path d="M -20,-10
             Q -30,-10 -30,-20
             Q -30,-28 -22,-28
             Q -20,-35 -10,-35
             Q 0,-35 5,-28
             Q 15,-28 18,-20
             Q 18,-10 10,-10
             Z"
          fill="white" opacity="0.95"/>

    <!-- 上传箭头 -->
    <g transform="translate(0, 5)">
      <!-- 箭头杆 -->
      <rect x="-2" y="-8" width="4" height="20" fill="white" rx="2"/>
      <!-- 箭头头部 -->
      <path d="M 0,-12 L -8,-4 L -4,-4 L -4,0 L 4,0 L 4,-4 L 8,-4 Z" fill="white"/>
    </g>
  </g>

  <!-- 装饰性小云朵 -->
  <g transform="translate(32, 32)" opacity="0.3">
    <ellipse cx="0" cy="0" rx="6" ry="4" fill="white"/>
    <ellipse cx="5" cy="-2" rx="4" ry="3" fill="white"/>
  </g>

  <g transform="translate(96, 96)" opacity="0.3">
    <ellipse cx="0" cy="0" rx="5" ry="3" fill="white"/>
    <ellipse cx="4" cy="-1" rx="3" ry="2" fill="white"/>
  </g>
</svg>
